<!doctype html>
<html>
  <head>
    <title>BitMaker 24</title>
    <style>
      body {
        background: #0b0f19;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        min-height: 95vh;
        flex-direction: column;
        font-family: system-ui, sans-serif;
      }
      #s {
        appearance: none;
        width: 160px;
        height: 5px;
        border-radius: 5px;
        background: #555;
      }
      #s::-webkit-slider-thumb {
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: white;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="940" height="400"></canvas>
    <input type="range" id="s" min="40" max="240" value="120" />
    <h3>120 BPM</h3>
    <script>
      const c = document.querySelector("#c");
      const q = document.querySelector("h3");
      const x = c.getContext("2d");

      let currentStep = 0;
      let bpm = 120;
      let buttons = [[], [], []];
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 16; j++) {
          buttons[i].push([0 + j * 60, 0 + i * 100, false, "grey"]);
        }
      }
      let track = [];
      for (let i = 0; i < 16; i++) {
        track.push([0 + i * 60, 280, false, "grey"]);
      }
      function playStep() {
        track.forEach((b) => {
          b[3] = "grey";
        });

        track[currentStep][3] = "red";
        currentStep++;

        if (currentStep >= 16) {
          currentStep = 0;
        }
        setTimeout(playStep, 60000 / bpm);
      }

      function animate() {
        x.clearRect(0, 0, c.width, c.height);
        for (let i = 0; i < 3; i++) {
          buttons[i].forEach((b) => {
            x.beginPath();
            x.roundRect(b[0], b[1], 40, 60, 7);
            x.fillStyle = b[3];
            x.fill();
          });
        }
        track.forEach((b) => {
          x.beginPath();
          x.roundRect(b[0], b[1], 40, 10, 7);
          x.fillStyle = b[3];
          x.fill();
        });
        requestAnimationFrame(animate);
      }
      c.onclick = (e) => {
        // audio.resume();
        let m = e.offsetX;
        let n = e.offsetY;

        for (let i = 0; i < 3; i++) {
          buttons[i].forEach((b) => {
            if (m >= b[0] && m <= b[0] + 40 && n >= b[1] && n <= b[1] + 60) {
              b[3] = b[3] === "red" ? "grey" : "red";
            }
          });
        }
      };

      playStep();
      s.oninput = (e) => {
        bpm = Number(e.target.value);
        q.textContent = `${bpm} BPM`;
      };
      animate();
    </script>
  </body>
</html>
