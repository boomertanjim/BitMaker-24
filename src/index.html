<!doctype html>
<html>
  <head>
    <title>BitMaker 24</title>
    <style>
      body {
        background: #0b0f19;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        min-height: 95vh;
        flex-direction: column;
        font-family: system-ui, sans-serif;
      }
      #s {
        appearance: none;
        width: 160px;
        height: 5px;
        border-radius: 5px;
        background: #555;
      }
      #s::-webkit-slider-thumb {
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: white;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="940" height="400"></canvas>
    <input type="range" id="s" min="40" max="240" value="120" />
    <h3>120 BPM</h3>
    <script>
      const c = document.querySelector("#c");
      const q = document.querySelector("h3");
      const s = document.querySelector("#s");
      const audio = new AudioContext();
      const x = c.getContext("2d");

      let currentStep = 0;
      let bpm = 120;
      let buttons = [[], [], []];
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 16; j++) {
          buttons[i].push([0 + j * 60, 0 + i * 100, false, "grey"]);
        }
      }
      let track = [];
      for (let i = 0; i < 16; i++) {
        track.push([0 + i * 60, 280, false, "grey"]);
      }
      function playStep() {
        track.forEach((b) => {
          b[3] = "grey";
        });

        track[currentStep][3] = "red";
        for (let i = 0; i < 3; i++) {
          buttons[i].forEach((b, j) => {
            if (b[2] && currentStep == j) {
              playNote(i);
            }
          });
        }
        currentStep++;

        if (currentStep >= 16) {
          currentStep = 0;
        }
        setTimeout(playStep, 60000 / bpm / 4);
      }
      function playNote(t) {
        let o = audio.createOscillator(),
          g = audio.createGain();
        if (t == 0) {
          let n = audio.currentTime;
          o.type = "sine";
          o.frequency.setValueAtTime(160, n);
          o.frequency.exponentialRampToValueAtTime(45, n + 0.06);
          g.gain.setValueAtTime(1.2, n);
          g.gain.exponentialRampToValueAtTime(0.001, n + 0.28);
          o.connect(g).connect(audio.destination);
          o.start(n);
          o.stop(n + 0.28);

          let l = audio.createOscillator();
          let lg = audio.createGain();

          l.type = "triangle";
          l.frequency.setValueAtTime(900, n);
          l.frequency.exponentialRampToValueAtTime(120, n + 0.012);
          lg.gain.setValueAtTime(0.35, n);
          lg.gain.exponentialRampToValueAtTime(0.001, n + 0.025);

          l.connect(lg).connect(audio.destination);
          l.start(n);
          l.stop(n + 0.03);
        } else if (t == 1) {
          let b = audio.createBuffer(
            1,
            audio.sampleRate * 0.12,
            audio.sampleRate,
          );
          let d = b.getChannelData(0);
          for (let i = 0; i < d.length; i++) {
            d[i] = Math.random() * 2 - 1;
          }
          let n = audio.createBufferSource();
          let f = audio.createBiquadFilter();

          f.type = "highpass";
          f.frequency.value = 1200;
          g.gain.setValueAtTime(0.25, audio.currentTime);
          g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 0.12);

          n.buffer = b;
          n.connect(f).connect(g).connect(audio.destination);
          n.start();
        } else {
          let b = audio.createBuffer(
            1,
            audio.sampleRate * 0.05,
            audio.sampleRate,
          );
          let d = b.getChannelData(0);
          for (let i = 0; i < d.length; i++) {
            d[i] = Math.random() * 2 - 1;
          }
          let n = audio.createBufferSource();
          let f = audio.createBiquadFilter();

          f.type = "highpass";
          f.frequency.value = 5000;
          g.gain.setValueAtTime(0.12, audio.currentTime);
          g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 0.05);

          n.buffer = b;
          n.connect(f).connect(g).connect(audio.destination);
          n.start();
        }
      }
      function animate() {
        x.clearRect(0, 0, c.width, c.height);
        for (let i = 0; i < 3; i++) {
          buttons[i].forEach((b) => {
            x.beginPath();
            x.roundRect(b[0], b[1], 40, 60, 7);
            x.fillStyle = b[3];
            x.fill();
          });
        }
        track.forEach((b) => {
          x.beginPath();
          x.roundRect(b[0], b[1], 40, 10, 7);
          x.fillStyle = b[3];
          x.fill();
        });
        requestAnimationFrame(animate);
      }
      c.onclick = (e) => {
        audio.resume();
        let m = e.offsetX;
        let n = e.offsetY;

        for (let i = 0; i < 3; i++) {
          buttons[i].forEach((b) => {
            if (m >= b[0] && m <= b[0] + 40 && n >= b[1] && n <= b[1] + 60) {
              b[3] = b[3] === "red" ? "grey" : "red";
              b[2] = b[2] === true ? false : true;
            }
          });
        }
      };

      playStep();
      s.oninput = (e) => {
        bpm = Number(e.target.value);
        q.textContent = `${bpm} BPM`;
      };
      animate();
    </script>
  </body>
</html>
