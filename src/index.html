<!doctype html>
<html>
  <head>
    <title>BitMaker 24</title>
    <style>
      body {
        background: #0b0f19;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        min-height: 95vh;
        flex-direction: column;
        font-family: system-ui, sans-serif;
      }
      #s {
        appearance: none;
        width: 160px;
        height: 5px;
        border-radius: 5px;
        background: #555;
      }
      #s::-webkit-slider-thumb {
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: white;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="940" height="400"></canvas>
    <input type="range" id="s" min="1" max="20" value="8" />
    <script>
      const c = document.querySelector("#c");
      const x = c.getContext("2d");

      let buttons = [[], [], []];
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 16; j++) {
          buttons[i].push([0 + j * 60, 0 + i * 100, false, "grey"]);
        }
      }

      function animate() {
        x.clearRect(0, 0, c.width, c.height);
        for (let i = 0; i < 3; i++) {
          buttons[i].forEach((b) => {
            x.beginPath();
            x.roundRect(b[0], b[1], 40, 60, 7);
            x.fillStyle = b[3];
            x.fill();
          });
        }
        requestAnimationFrame(animate);
      }
      animate();
    </script>
  </body>
</html>
